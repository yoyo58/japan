<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d1130">
  <title>Japon 2027</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%23e8452a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Serif+JP:wght@700;900&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="side">
      <a class="brand" href="#/">
        <span class="sun">日</span>
        <span>Japon <b>2027</b></span>
      </a>
      <button class="search-btn" data-open-pal>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span>Rechercher</span><kbd>Ctrl K</kbd>
      </button>
      <nav class="nav" id="nav"><span class="nav-ind" aria-hidden="true"></span></nav>
      <div class="side-foot">
        <button class="ghost" id="theme" title="Changer de thème (D)" aria-label="Changer de thème"></button>
      </div>
    </aside>
    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <button class="fab-search" data-open-pal aria-label="Rechercher">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  </button>
  <nav class="tabbar" id="tabbar"><span class="tab-ind" aria-hidden="true"></span></nav>

  <div class="pal" id="pal" hidden>
    <div class="pal-box" role="dialog" aria-label="Recherche">
      <div class="pal-in">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="pal-q" type="text" placeholder="Un jour, un lieu, une tâche, un objet…" autocomplete="off" spellcheck="false">
        <kbd>Esc</kbd>
      </div>
      <div class="pal-list" id="pal-list" role="listbox"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
